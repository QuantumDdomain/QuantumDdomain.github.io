<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Linear Equation Solver</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/pyodide/v0.25.1/full/pyodide.js"></script>
  <script src="../../service-worker-setup.js"></script>
  <script src="../../load-pyodide-and-app.js"></script>
  <script src="../../calculator.js"></script>
  <style>
    
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', sans-serif;
    }
    
    .container {
      width: 100%;
      max-width: 42rem;
      margin: 0 auto;
      padding: 1.5rem;
      background: white;
      border-radius: 0.75rem;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
      margin-top: 2.5rem;
      border: 1px solid #e5e7eb;
    }
    
    .title {
      font-size: 1.875rem;
      font-weight: 800;
      text-align: center;
      color: #1f2937;
      margin-bottom: 2rem;
    }
    
    .dimension-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 1.5rem;
      padding: 1rem;
      border: 1px solid #bfdbfe;
      border-radius: 0.5rem;
      background: #eff6ff; /* Light blue background */
    }
    
    @media (min-width: 640px) {
      .dimension-container {
        flex-direction: row;
        gap: 1rem;
      }
    }
    
    .dimension-label {
      font-size: 1.125rem;
      font-weight: 500;
      color: #374151;
      width: 100%;
      padding-bottom: 0.5rem;
    }
    
    @media (min-width: 640px) {
      .dimension-label {
        width: 50%;
        padding-bottom: 0;
      }
    }
    
    .dimension-input {
      width: 100%;
      padding: 0.75rem;
      border: 2px solid #60a5fa;
      border-radius: 0.5rem;
      text-align: center;
      font-family: monospace;
      font-size: 1.25rem;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }
    
    @media (min-width: 640px) {
      .dimension-input {
        width: 50%;
      }
    }
    
    .dimension-input:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
      outline: none;
    }
    
    .matrix-container {
      margin-top: 2rem;
    }
    
    .section-title {
      font-size: 1.25rem;
      font-weight: 600;
      color: #1f2937;
      margin-bottom: 1rem;
      padding-bottom: 0.5rem;
      border-bottom: 1px solid #e5e7eb;
    }
    
    .input-grid {
      display: grid;
      gap: 0.5rem;
      max-width: 28rem;
      margin: 0 auto;
    }
    
    /* IMPORTANT: Inputs are now type="text" to accept fractions like 1/2 */
    .matrix-input, .vector-input {
      padding: 0.5rem;
      border: 1px solid #d1d5db;
      border-radius: 0.375rem;
      text-align: center;
      font-size: 1rem;
      font-family: 'Inter', sans-serif;
      transition: all 0.15s ease;
      background-color: #ffffff;
      /* Style hint for fractions */
      font-style: italic; 
    }
    
    .matrix-input:focus, .vector-input:focus {
      border-color: #3b82f6;
      outline: none;
      box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.5);
      font-style: normal; /* Remove italic when focused */
    }
    
    .matrix-section {
      margin-bottom: 1.5rem;
    }
    
    .solve-button {
      width: 100%;
      padding: 0.75rem;
      margin-top: 2rem;
      background: #10b981; /* Green color for action */
      color: white;
      font-weight: bold;
      font-size: 1.125rem;
      border: none;
      border-radius: 0.5rem;
      box-shadow: 0 4px 6px -1px rgba(16, 185, 129, 0.3);
      cursor: pointer;
      transition: background-color 0.2s ease, box-shadow 0.2s ease;
    }
    
    .solve-button:hover {
      background: #059669;
    }
    
    .solve-button:focus {
      outline: none;
      box-shadow: 0 0 0 4px rgba(16, 185, 129, 0.5);
    }
    
    .solve-button:active {
      background: #047857;
    }
    
    .output {
      margin-top: 1.5rem;
      padding: 1rem;
      background: #f0fdf4; /* Light success background */
      border: 1px solid #dcfce7;
      border-radius: 0.5rem;
      font-family: monospace;
      font-size: 0.875rem;
      white-space: pre-wrap;
      min-height: 50px;
    }
    
    .error {
      border-color: #ef4444 !important;
      box-shadow: 0 0 0 2px rgba(239, 68, 68, 0.2) !important;
    }
    
  </style>
</head>
<body>
  <div class="container">
    <h1 class="title">System of Linear Equations Solver</h1>

    <!-- Dimension Input -->
    <div class="dimension-container">
      <label for="n" class="dimension-label">Matrix Size (N):</label>
      <input type="number" id="n" value="3" min="1" max="10"
        oninput="generateMatrixInputs(this.value)"
        class="dimension-input"
      />
    </div>

    <!-- Dynamic Matrix and Vector Input Container -->
    <div id="matrix-container" class="matrix-container">
      <!-- Matrix inputs will be dynamically generated here -->
    </div>

    <!-- Solve Button -->
    <button onclick="solveSystem()" class="solve-button">
      Solve System Matrix
    </button>

    <!-- Output Area -->
    <div id="output" class="output">
      Loading...
    </div>
  </div>

  <script>
    // --- PYODIDE INITIALIZATION ---
    // Standard Pyodide setup
    let pyodideReady = (async () => {
      const outputElement = document.getElementById("output");
      try {
          outputElement.textContent = "Loading ...";
          const pyodide = await loadPyodide();
          outputElement.textContent = "Loading ...";
          await pyodide.loadPackage(["numpy", "sympy"]);
          return pyodide;
      } catch (e) {
          outputElement.textContent = "❌ Failed to load Pyodide: " + e;
          throw e;
      }
    })();

    // --- DYNAMIC INPUT GENERATION ---

    const DEFAULT_A = [['2', '1/2', '1'], ['3', '2', '3'], ['1', '4', '9']]; // Updated 1 to 1/2 for demonstration
    const DEFAULT_B = ['10', '18', '16'];

    /**
     * Generates the N x N input grid for Matrix A and N x 1 for Vector B.
     * @param {string} n - The size of the matrix (N).
     */
    function generateMatrixInputs(n) {
        const N = parseInt(n) || 1;
        const container = document.getElementById('matrix-container');
        container.innerHTML = '';

        if (N < 1 || N > 10) {
            container.innerHTML = '<p style="color: #ef4444; font-weight: 600; text-align: center;">Please enter a size between 1 and 10.</p>';
            return;
        }

        let html = '<h2 class="section-title">Enter Coefficients (A) and Constants (B)</h2>';
        
        // Main container for A and B - stacked vertically
        html += '<div style="display: flex; flex-direction: column; gap: 1.5rem;">'; 

        // ------------------ Matrix A Container ------------------
        html += '<div class="matrix-section">';
        html += '<label style="display: block; font-size: 0.875rem; font-weight: 500; color: #374151; margin-bottom: 0.5rem;">Matrix A (' + N + 'x' + N + ')</label>';
        
        // Grid setup for Matrix A
        html += `<div class="input-grid" style="grid-template-columns: repeat(${N}, minmax(0, 1fr));" id="matrixA-grid">`;
        
        // Generate Matrix A inputs (type="text" now)
        for (let i = 0; i < N; i++) {
            for (let j = 0; j < N; j++) {
                let defaultValue = '';
                if (N === 3 && i < DEFAULT_A.length && j < DEFAULT_A[i].length) {
                    defaultValue = DEFAULT_A[i][j];
                }
                html += `<input type="text" id="A_${i}_${j}" value="${defaultValue}" 
                        placeholder="A[${i+1},${j+1}]" title="A[${i+1},${j+1}]" 
                        class="matrix-input" />`;
            }
        }
        html += '</div></div>';

        // ------------------ Vector B Container ------------------
        html += '<div class="matrix-section">';
        html += '<label style="display: block; font-size: 0.875rem; font-weight: 500; color: #374151; margin-bottom: 0.5rem;">Vector B (' + N + 'x1)</label>';
        
        // Grid setup for Vector B
        html += `<div class="input-grid" style="grid-template-columns: repeat(${N}, minmax(0, 1fr));" id="vectorB-grid">`;

        // Generate Vector B inputs (type="text" now)
        for (let i = 0; i < N; i++) {
            let defaultValue = '';
            if (N === 3 && i < DEFAULT_B.length) {
                defaultValue = DEFAULT_B[i];
            }
            html += `<input type="text" id="B_${i}" value="${defaultValue}" 
                    placeholder="B[${i+1}]" title="B[${i+1}]" 
                    class="vector-input" />`;
        }
        html += '</div></div>';
        
        html += '</div>';
        
        container.innerHTML = html;
    }

    // --- SOLVER LOGIC ---

    /**
     * Collects data from the dynamic inputs, formats it, and calls Pyodide to solve the system.
     */
    async function solveSystem() {
        const pyodide = await pyodideReady;
        const N = parseInt(document.getElementById("n").value);

        let matrixA_values = [];
        let vectorB_values = [];
        let valid = true; // Now only checks for non-empty input

        // Collect Matrix A values
        for (let i = 0; i < N; i++) {
            let row = [];
            for (let j = 0; j < N; j++) {
                const input = document.getElementById(`A_${i}_${j}`);
                const val = input ? input.value.trim() : '';
                if (val === '') { // Check only for empty string, let SymPy handle validity
                    valid = false;
                    if(input) input.classList.add('error');
                } else {
                     if(input) input.classList.remove('error');
                     row.push(val);
                }
            }
            if (valid) matrixA_values.push(row.join(' '));
        }

        // Collect Vector B values
        for (let i = 0; i < N; i++) {
            const input = document.getElementById(`B_${i}`);
            const val = input ? input.value.trim() : '';
            if (val === '') { // Check only for empty string
                valid = false;
                if(input) input.classList.add('error');
            } else {
                if(input) input.classList.remove('error');
                vectorB_values.push(val);
            }
        }

        const outputElement = document.getElementById("output");
        
        if (!valid) {
            outputElement.innerText = "❌ Error: Please ensure all matrix and vector fields are filled with values.";
            return;
        }

        outputElement.textContent = "Solving System Matrix... please wait.";

        // Format data for Python (Pyodide)
        const matrixA_str = matrixA_values.join('\n');
        const vectorB_str = vectorB_values.join(' ');

        try {
            // Run the self-contained Python script
            // The key change is that `sp.sympify(val)` is now able to parse fractions and simple expressions.
            pyodide.runPython(`
import sympy as sp
from sympy.parsing.mathematica import parse_mathematica

# Parsing input data from JavaScript strings
raw_matrix = """${matrixA_str}"""
raw_vector = """${vectorB_str}"""

# Convert input into symbolic matrix and vector
try:
    # Use sympify on each string value, allowing fractions (e.g., 1/2) and simple expressions (e.g., 3*4)
    A = [[sp.sympify(val) for val in row.split()] for row in raw_matrix.strip().split('\\n') if row.strip()]
    B = [sp.sympify(val) for val in raw_vector.strip().split()]
except Exception as e:
    raise ValueError(f"Could not parse matrix values. Please check for valid mathematical expressions. Details: {e}")

# Checking matrix dimensions
n = ${N}
if len(A) != n or any(len(row) != n for row in A) or len(B) != n:
    raise ValueError("Matrix dimensions do not match the expected size (N x N and N x 1).")

# Solving the system using Gauss-Jordan Elimination
def gauss_jordan_elimination(A, B):
    n = len(A)
    # Augmented matrix [A | B]
    A_aug = [row + [b] for row, b in zip(A, B)]

    for i in range(n):
        # Partial Pivoting: Find the row with the largest element in the current column i
        # Use abs(A_aug[r][i].evalf()) for reliable comparison of symbolic/float values
        max_row = max(range(i, n), key=lambda r: abs(A_aug[r][i].evalf())) 
        # Swap rows
        A_aug[i], A_aug[max_row] = A_aug[max_row], A_aug[i]

        pivot = A_aug[i][i]
        
        # Check if pivot is numerically zero (using evalf for safety with complex symbols)
        if pivot.evalf() == 0:
            # Check for infinite solutions or no solution
            if A_aug[i][n].evalf() != 0:
                raise Exception("No unique solution exists (system is inconsistent).")
            continue
            
        # Normalize the pivot row (make the diagonal element 1)
        A_aug[i] = [x / pivot for x in A_aug[i]]

        # Eliminate the column entries (make all other elements in column i zero)
        for j in range(n):
            if j != i:
                factor = A_aug[j][i]
                A_aug[j] = [A_aug[j][k] - factor * A_aug[i][k] for k in range(n + 1)]

    # Extracting the solutions
    result = [row[-1].simplify() for row in A_aug] # Simplify the result
    
    # Check for consistency/uniqueness
    for i in range(n):
        # Check if the diagonal is zero and the constant term is non-zero
        if A_aug[i][i].evalf() == 0 and A_aug[i][-1].evalf() != 0:
             raise Exception("No solution exists (inconsistent system).")

    return result

# Solving the system and storing the result
result = gauss_jordan_elimination(A, B)
            `);

            const result = pyodide.globals.get("result").toJs();

            // Displaying the results
            const solutionText = result.map((val, i) => {
                // SymPy values (val) are often Fractions or Floats.
                let displayVal = val.toString();
                // Optionally display the decimal approximation for clarity
                let decimalVal = val.is_Number ? val.evalf(6).toString() : ''; 
                
                let finalDisplay = `x${i + 1} = ${displayVal}`;
                if (decimalVal && displayVal !== decimalVal) {
                    finalDisplay += ` ≈ ${decimalVal}`;
                }

                return finalDisplay;
            }).join("\n");

            document.getElementById("output").innerText =
              "✅ Solution found:\n\n" + solutionText;

        } catch (err) {
            outputElement.innerText = "❌ Calculation Error:\n" + (err.message || err.toString());
        }
    }

    // Initialize the matrix inputs when the script loads
    pyodideReady
      .then(() => {
        generateMatrixInputs(document.getElementById("n").value);
        document.getElementById("output").textContent = "Loaded. Ready to input and solve!";
      })
      .catch(err => document.getElementById("output").textContent = "❌ Failed to load solver engine: " + err);
  </script>
</body>
</html>
